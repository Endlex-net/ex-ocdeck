name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub macOS runner 未预装 tmux，process 集成测试需要真实 tmux 二进制
      - name: Install tmux
        run: brew install tmux

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # web/dist 是 go:embed 目标，vet/test 前必须先构建前端
      - name: Build web
        run: cd web && pnpm install --frozen-lockfile && pnpm build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub ubuntu runner 未预装 tmux，process 集成测试需要真实 tmux 二进制
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # web/dist 是 go:embed 目标，vet/test 前必须先构建前端
      - name: Build web
        run: cd web && pnpm install --frozen-lockfile && pnpm build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
